<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formation Grande Distribution</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- En-tête -->
  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__logo">🏬</span>
      <div>
        <h1 class="app-header__title">Formation Grande Distribution</h1>
        <p class="app-header__subtitle" id="app-subtitle">Explorez le magasin, cliquez sur un espace pour découvrir les métiers</p>
      </div>
    </div>
    <div class="app-header__right">
      <div class="salary-switch" id="salary-switch" role="group" aria-label="Format de magasin pour les salaires">
        <span class="salary-switch__label">💶 Salaires</span>
        <button type="button" data-fmt="hyper">Hyper</button>
        <button type="button" data-fmt="super">Super</button>
        <button type="button" data-fmt="proximite">Proximité</button>
      </div>
      <nav class="breadcrumb" id="breadcrumb" aria-label="Fil d'ariane"></nav>
    </div>
  </header>

  <!-- Onglets de formation -->
  <nav class="app-tabs" id="app-tabs" aria-label="Onglets de formation">
    <button type="button" class="app-tab is-active" data-tab="metiers">🧭 Formation Métiers</button>
    <button type="button" class="app-tab" data-tab="marche">📊 Formation Marché</button>
  </nav>

  <!-- ============ ONGLET 1 : MÉTIERS (plan du magasin) ============ -->
  <main class="stage" id="stage">

    <!-- Niveau 0 : plan du magasin -->
    <section class="view view--map is-active" id="view-map" aria-label="Plan du magasin">
      <div class="dept-bar" id="dept-bar" aria-label="Grandes catégories"></div>
      <div class="store-map" id="store-map"></div>
      <p class="hint">👆 Cliquez sur un espace pour zoomer &nbsp;·&nbsp; 🍎🛍️❄️ cliquez une <strong>grande catégorie</strong> ci-dessus pour voir les rayons regroupés</p>
    </section>

    <!-- Niveau 1 : sous-espaces et métiers d'une zone -->
    <section class="view view--zone" id="view-zone" aria-label="Détail d'un espace" hidden>
      <button class="btn-back" id="btn-back-map">← Retour au plan du magasin</button>
      <div class="zone-detail" id="zone-detail"></div>
    </section>
  </main>

  <!-- Niveau 2 : panneau fiche métier -->
  <aside class="job-panel" id="job-panel" aria-hidden="true">
    <div class="job-panel__overlay" id="job-panel-overlay"></div>
    <div class="job-panel__content" role="dialog" aria-modal="true" aria-labelledby="job-panel-title">
      <button class="job-panel__close" id="job-panel-close" aria-label="Fermer">✕</button>
      <div id="job-panel-body"></div>
    </div>
  </aside>

  <!-- ============ ONGLET 2 : MARCHÉ ============ -->
  <main class="market" id="market" hidden aria-label="Formation marché"></main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/marche.js"></script>
</body>
</html>
